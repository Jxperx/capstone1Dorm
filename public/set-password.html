<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password - EliteStay Tenant Portal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #121212;
            --accent: #c5a059;
            --cream-bg: #faf6ef;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #121212 0%, #1e1e1e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .setup-card {
            background: #ffffff;
            color: #121212;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 460px;
            width: 100%;
            overflow: hidden;
        }
        .setup-header {
            background: #121212;
            color: #ffffff;
            padding: 30px 25px;
            text-align: center;
            border-bottom: 2px solid var(--accent);
        }
        .brand-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }
        .btn-gold {
            background: var(--accent);
            color: #121212;
            font-weight: 600;
            border: none;
            border-radius: 25px;
            padding: 12px 24px;
            transition: all 0.3s ease;
        }
        .btn-gold:hover {
            background: #b08d4a;
            color: #ffffff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="setup-card">
    <div class="setup-header">
        <div class="brand-title mb-1"><i class="fas fa-home me-2"></i>ELITESTAY MANAGER</div>
        <p class="small text-white-50 mb-0">Tenant Self-Service Onboarding</p>
    </div>

    <div class="card-body p-4">
        <div id="loadingState" class="text-center py-4">
            <div class="spinner-border text-warning mb-3" role="status"></div>
            <p class="text-muted small">Verifying setup token link...</p>
        </div>

        <div id="errorState" style="display: none;" class="alert alert-danger text-center">
            <i class="fas fa-exclamation-circle fs-3 mb-2"></i>
            <h6 class="fw-bold mb-1" id="errorTitle">Invalid Setup Link</h6>
            <p class="small mb-0" id="errorMsg">This link may be expired or already used.</p>
        </div>

        <div id="formState" style="display: none;">
            <div class="alert alert-info border-0 rounded-3 small mb-4">
                <i class="fas fa-info-circle me-1"></i> Hello <strong id="tenantName">Tenant</strong> (<span id="tenantEmail">email</span>), please create a secure password to access your portal.
            </div>

            <form id="setPasswordForm">
                <input type="hidden" id="tokenInput">

                <div class="mb-3">
                    <label class="form-label fw-bold small text-uppercase">New Password</label>
                    <div class="input-group">
                        <input type="password" id="newPassword" class="form-control" placeholder="••••••••" required minlength="6">
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassVisibility('newPassword', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="form-text extra-small">Minimum 6 characters.</div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small text-uppercase">Confirm New Password</label>
                    <div class="input-group">
                        <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required minlength="6">
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassVisibility('confirmPassword', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" id="btnSubmit" class="btn btn-gold py-2 text-uppercase">
                        <i class="fas fa-key me-2"></i> Set Password & Log In
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function togglePassVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fas fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fas fa-eye';
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const formState = document.getElementById('formState');

        if (!token) {
            loadingState.style.display = 'none';
            errorState.style.display = 'block';
            document.getElementById('errorMsg').textContent = 'No setup token provided in URL.';
            return;
        }

        document.getElementById('tokenInput').value = token;

        try {
            let res = await fetch(`/api/auth/verify-setup-token?token=${encodeURIComponent(token)}`);
            if (res.status === 404) {
                res = await fetch(`/api/verify-setup-token?token=${encodeURIComponent(token)}`);
            }
            const data = await res.json();

            loadingState.style.display = 'none';
            if (res.ok && data.valid) {
                document.getElementById('tenantName').textContent = data.fullName || 'Tenant';
                document.getElementById('tenantEmail').textContent = data.email || '';
                formState.style.display = 'block';
            } else {
                errorState.style.display = 'block';
                document.getElementById('errorMsg').textContent = data.error || 'Invalid or expired setup token link.';
            }
        } catch (err) {
            loadingState.style.display = 'none';
            errorState.style.display = 'block';
            document.getElementById('errorMsg').textContent = 'Unable to verify setup token. Please check your internet connection or ask your admin for a new link.';
        }

        document.getElementById('setPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (pass !== confirm) {
                alert('Passwords do not match. Please re-enter.');
                return;
            }

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Setting Password...';

            try {
                let res = await fetch('/api/auth/set-tenant-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password: pass })
                });
                if (res.status === 404) {
                    res = await fetch('/api/set-tenant-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, password: pass })
                    });
                }

                const result = await res.json();
                if (res.ok && result.success) {
                    alert('✅ Account activated successfully! Welcome to EliteStay.');
                    window.location.href = result.redirectUrl || '/tenant-dashboard.html';
                } else {
                    alert('❌ Error: ' + (result.error || 'Failed to set password'));
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-key me-2"></i> Set Password & Log In';
                }
            } catch (err) {
                console.error(err);
                alert('❌ Network error setting password.');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-key me-2"></i> Set Password & Log In';
            }
        });
    });
</script>
</body>
</html>
