<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed – EliteStay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent: #c5a059; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a0a0a, #2d1515, #3c1e1e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            max-width: 480px;
            width: 100%;
            padding: 3rem 2.5rem;
            text-align: center;
        }
        .fail-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e53935, #b71c1c);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-8px); }
            40%       { transform: translateX(8px); }
            60%       { transform: translateX(-5px); }
            80%       { transform: translateX(5px); }
        }
        .brand {
            font-family: 'Playfair Display', serif;
            color: var(--accent);
            font-size: 1.8rem;
            font-weight: 700;
        }
        .brand-sub {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #888;
            margin-bottom: 2rem;
        }
        h2 { font-weight: 700; font-size: 1.6rem; }
        .btn-retry {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(197,160,89,0.4);
            color: #fff;
        }
        .btn-back {
            border-radius: 50px;
            padding: 0.75rem 2rem;
            font-weight: 600;
        }
        .badge-status {
            background: #fff0f0;
            color: #e53935;
            border-radius: 50px;
            padding: 0.4rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">EliteStay</div>
        <div class="brand-sub">Premium Student Living</div>

        <div class="fail-icon">
            <i class="fas fa-times fa-2x text-white"></i>
        </div>

        <div class="badge-status"><i class="fas fa-circle-xmark me-1"></i> Payment Failed</div>

        <h2 class="mb-2">Payment Unsuccessful</h2>
        <p class="text-muted mb-4">
            Your GCash payment was not completed. This could be because the payment was cancelled, 
            timed out, or encountered an error. No charges were made.
        </p>

        <div class="d-grid gap-2">
            <a href="/tenant" class="btn btn-retry">
                <i class="fas fa-redo me-2"></i> Try Again
            </a>
            <a href="/tenant" class="btn btn-outline-secondary btn-back">
                <i class="fas fa-home me-2"></i> Back to Dashboard
            </a>
        </div>

        <p class="text-muted small mt-3">
            Need help? Contact us at
            <a href="mailto:support@elitestay.com">support@elitestay.com</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
